<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Harshit Verma — Applied AI and Systems</title>
  <desc id="desc">A dark technical banner showing a pipeline from evidence to models to products.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1727"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="25%" r="70%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".13"/>
      <stop offset=".55" stop-color="#6366f1" stop-opacity=".05"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <path d="M0 352 C240 302 360 415 620 355 S1040 272 1280 328 V420 H0Z" fill="#0e1a2b" opacity=".72"/>
  <circle cx="1110" cy="88" r="94" fill="#22d3ee" opacity=".04" filter="url(#soft)"/>

  <g transform="translate(72 63)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="188" height="28" rx="14" fill="#102438" stroke="#1e4159"/>
    <circle cx="18" cy="14" r="4" fill="#22d3ee"/>
    <text x="32" y="19" fill="#a5f3fc" font-size="13" letter-spacing="2">OPEN TO BUILD</text>

    <text x="0" y="103" fill="#f8fafc" font-size="58" font-weight="700" letter-spacing="-2">HARSHIT VERMA</text>
    <rect x="0" y="124" width="525" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="170" fill="#a5b4fc" font-size="24" letter-spacing="3">APPLIED AI / SYSTEMS / PRODUCT</text>

    <text x="0" y="226" fill="#94a3b8" font-size="18">Turning unstructured data into</text>
    <text x="0" y="254" fill="#e2e8f0" font-size="18">deployed, queryable systems.</text>
  </g>

  <g transform="translate(730 84)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M55 72H191M239 72H375" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M181 66l10 6-10 6M365 66l10 6-10 6" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g>
      <rect x="0" y="18" width="135" height="108" rx="15" fill="#0d1d2d" stroke="#1e4159"/>
      <circle cx="68" cy="58" r="16" fill="#102d3b" stroke="#22d3ee"/>
      <path d="M61 58h14M68 51v14" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
      <text x="68" y="98" text-anchor="middle" fill="#cbd5e1" font-size="12" letter-spacing="1.5">EVIDENCE</text>
    </g>

    <g>
      <rect x="191" y="18" width="135" height="108" rx="15" fill="#111c31" stroke="#343d74"/>
      <circle cx="259" cy="58" r="16" fill="#252447" stroke="#818cf8"/>
      <path d="M250 63l7-11 5 8 6-5" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="259" y="98" text-anchor="middle" fill="#cbd5e1" font-size="12" letter-spacing="1.5">MODELS</text>
    </g>

    <g>
      <rect x="375" y="18" width="135" height="108" rx="15" fill="#0d1d2d" stroke="#1e4159"/>
      <circle cx="443" cy="58" r="16" fill="#102d3b" stroke="#22d3ee"/>
      <path d="M435 53h16v11h-16zM439 49h8" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="443" y="98" text-anchor="middle" fill="#cbd5e1" font-size="12" letter-spacing="1.5">PRODUCTS</text>
    </g>

    <rect x="0" y="159" width="510" height="94" rx="14" fill="#091522" stroke="#1e293b"/>
    <circle cx="22" cy="179" r="4" fill="#fb7185"/>
    <circle cx="37" cy="179" r="4" fill="#fbbf24"/>
    <circle cx="52" cy="179" r="4" fill="#34d399"/>
    <text x="20" y="212" fill="#64748b" font-size="13">$ philosophy --production</text>
    <text x="20" y="236" fill="#e2e8f0" font-size="13">measure → verify → ship</text>
    <rect x="222" y="225" width="8" height="15" fill="#67e8f9" opacity=".85"/>
  </g>

  <g transform="translate(72 380)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">
    <text fill="#64748b">IIT KHARAGPUR</text>
    <text x="153" fill="#334155">/</text>
    <text x="174" fill="#64748b">AI ENGINEERING</text>
    <text x="324" fill="#334155">/</text>
    <text x="345" fill="#64748b">HUMAN-IN-THE-LOOP</text>
  </g>

  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="#334155" stroke-opacity=".75"/>
</svg>
